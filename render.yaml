# Render Blueprint — the Chiron engine as a public, rate-limited HTTP endpoint.
#
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo (chiron-vault)
# -> Apply. Render reads this file, builds the Dockerfile, and serves it.
#
# Open by design (no token): the value is "run the real engine on YOUR input".
# It is bounded, not unguarded — per-IP + global rate limits, input caps at the
# certify bounds, bounded concurrency, and REFUSED on anything over budget. To
# lock it down later, add CHIRON_API_TOKEN in the Render dashboard (no redeploy
# of code needed) and the client sends `Authorization: Bearer <token>`.
services:
  - name: chiron-engine
    type: web
    runtime: docker
    plan: free                 # free instance spins down when idle; fine for a demo
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false          # deploy on demand, not on every vault push
    envVars:
      - key: CHIRON_TRUST_FORWARDED   # Render fronts a proxy; take client IP from X-Forwarded-For
        value: "1"
      - key: CHIRON_RATE_PER_MIN      # per-IP budget
        value: "20"
      - key: CHIRON_RATE_GLOBAL_PER_MIN
        value: "120"
      - key: CHIRON_MAX_CONCURRENCY   # free instance is small; keep engine calls bounded
        value: "2"
