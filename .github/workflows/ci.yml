name: Chiron CI

# Every gate here is offline and deterministic. The OEIS step runs against the
# committed live-fetched corpus cache; run `Primus/oeis_live.py --live` locally
# to re-verify against today's OEIS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Windows runners default Python's console to a legacy code page; our gate
# output is legitimately UTF-8 (em-dashes, Schröder, Apéry, ✓ marks), so a
# single print can raise UnicodeEncodeError and fail a green gate run.
# UTF-8 mode ends the entire class.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # The packaged seed: matrixed across OS and the supported Python span.
  primus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the primus package
        run: pip install ./Primus
      - name: Primus stress tests (48 gates, via the compatibility shim)
        working-directory: Primus
        run: python test_invariant_engine.py
      - name: Primus internal benchmark (zero false confidence required)
        working-directory: Primus
        run: python benchmark.py
      - name: Package selftest (engine + certify gates)
        run: primus selftest
      - name: MCP server handshake (protocol gates, live subprocess)
        working-directory: Primus
        run: python test_mcp_server.py
      - name: Adversarial fuzz gates (certify layer)
        working-directory: Primus
        run: python test_certify_fuzz.py
      - name: External validation — live-OEIS corpus (zero false stamps required)
        working-directory: Primus
        run: python oeis_live.py
      - name: Certify kernel property sweep (invariant over a bounded grid, zero false stamps)
        working-directory: Primus
        run: python test_certify_property.py
      - name: Grounded layer gates (the module's own 20)
        working-directory: Primus
        run: python src/primus/grounded.py
      - name: Grounded units — VERIFIED must never cross a unit boundary (issue #3)
        working-directory: Primus
        run: python test_grounded_units.py
  # The flagship spine + the fold + differential testing, on one reference env.
  chiron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the primus package (numpy comes with it)
        run: pip install ./Primus
      - name: Engine self-test (full embedded gate suite)
        run: python Chiron/chiron.py selftest
      - name: Twin cross-lock (corpus ↔ exact arithmetic ↔ engine)
        run: python Primus/test_twins_exact.py
      - name: Grower offline dry-run
        run: python Chiron/chiron_grow.py --params Chiron/grow-public/parameters.json --dry-run --once
      - name: Unit tests
        run: |
          python Chiron/tests/test_chiron.py
          python Chiron/tests/test_grow.py
          python Chiron/tests/test_local_cors.py
      - name: Chiron MCP transport (real stdio JSON-RPC)
        run: python Chiron/tests/test_mcp_server.py
      - name: Credential detection works in both directions
        run: python3 ci/check_publishable.py --selftest

      - name: No iCloud conflicted copies committed
        run: python3 ci/check_duplicates.py

      - name: Publishable — no credentials, no machine-specific paths
        run: python3 ci/check_publishable.py

      - name: Current license claims match Apache-2.0
        run: python ci/check_license_claims.py
      - name: Claim kinds the engine emits are all in SCHEMA.md
        run: python ci/check_schema_kinds.py
      - name: docs/STATE.json matches the checkout (counts, tool surface)
        run: python ci/state.py --check
      - name: Drift detector — seed vs monolith must not contradict
        working-directory: Primus
        run: python drift_check.py
      - name: Adversarial stress probes (parity teeth, certificate honesty, ledger, launcher, 0-false, certify)
        run: python Chiron/stress_test.py selftest
      - name: Pipeline composer gates (chain/team/swarm — AND-of-required, never a false verify)
        run: python Chiron/pipeline.py selftest
      - name: SOP smoke — every documented command runs exactly as written
        run: python ci/sop_smoke.py
      - name: Monolith smoke (the fold still runs)
        working-directory: Chiron Monolith
        run: python chiron_monolith.py --smoke
      - name: Monolith staleness gate — rebuilding must be a no-op (the fold is deterministic)
        working-directory: Chiron Monolith
        run: |
          python build_monolith.py
          git diff --stat --exit-code chiron_monolith.py \
            || (echo "::error::monolith is stale — run 'chiron build' and commit the artifact" && exit 1)
