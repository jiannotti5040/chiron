# Release — build and publish primus-intelligence to PyPI on version tags.
#
# Uses PyPI Trusted Publishing (OIDC) — no API tokens in the repo.
#
# The publisher is NOT yet registered: the v0.7.0 and v0.7.1 tag runs both
# reached pypa/gh-action-pypi-publish and failed with `invalid-publisher`
# ("valid token, but no corresponding publisher"), and 0.6.4 and 0.9.0 were
# uploaded by hand with an API token instead. Register it once, at the PROJECT
# settings page — not /manage/account/publishing/, which is the pending-publisher
# form and only accepts project names that do not exist yet:
#
#   https://pypi.org/manage/project/primus-intelligence/settings/publishing/
#     Owner: jiannotti5040   Repository: chiron
#     Workflow: release.yml  Environment: pypi
#
# Those four values must match exactly; they are the claims PyPI compares
# against the OIDC token. Then:  git tag v0.10.0 && git push origin v0.10.0
#
# Do not twine-upload a version first. PyPI burns version numbers permanently
# (this repo already learned that at 0.6.4), so a manual upload of the same
# version makes the token-free path fail with a 400 and unrecoverable.
#
# The tag must match Primus/pyproject.toml's version (checked below).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(python -c "import tomllib;print(tomllib.load(open('Primus/pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          test "$PKG" = "$TAG" || { echo "tag v$TAG != pyproject $PKG"; exit 1; }
      - name: Run the full gate battery before anything ships
        run: |
          pip install ./Primus
          python bin/chiron test --full
          python Primus/test_certify_property.py
          python Primus/test_engine_server.py
          python bin/chiron parity
      - name: Monolith source is current
        working-directory: Chiron Monolith
        run: |
          python build_monolith.py
          git diff --stat --exit-code chiron_monolith.py \
            || (echo "::error::monolith is stale — run 'chiron build' and commit the artifact" && exit 1)
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build Primus --outdir dist/
      - name: License notice travels with the code (Apache-2.0 requirement)
        shell: bash
        run: python ci/check_wheel_license.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.repository, '/chiron')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
