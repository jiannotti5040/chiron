[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primus-intelligence"
version = "0.7.0"
description = "Exact invariant recovery with held-out verification and refusal — collapse codified surfaces to their minimal generators, and certify the checkable claims in LLM/agent output."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Jacob Iannotti", email = "jiannotti5040@gmail.com" }]
keywords = [
  "verification", "mdl", "minimum-description-length", "symbolic-regression",
  "sequence-induction", "llm-verification", "hallucination-gating",
  "abstention", "certification", "exact-arithmetic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
# guess-and-prove: the gplearn proposer behind the exact gate
# (primus.conjecture degrades to an honest REFUSED without it)
conjecture = ["gplearn>=0.4.2", "scikit-learn>=1.3"]

[project.scripts]
primus = "primus.cli:main"
primus-mcp = "primus.mcp_server:main"
primus-serve = "primus.engine_server:main"

[project.urls]
# All destinations are public: the vault and the public repo are now one
# Apache-2.0 repository at github.com/jiannotti5040/chiron.
Homepage = "https://github.com/jiannotti5040/chiron"
Repository = "https://github.com/jiannotti5040/chiron"
Documentation = "https://github.com/jiannotti5040/chiron/blob/main/docs/BATTERIES.md"
"Live demo" = "https://jiannotti5040.github.io/chiron/"
"Public eval" = "https://github.com/jiannotti5040/chiron/tree/main/eval"

[tool.setuptools]
# Apache-2.0 requires the license notice to travel with the code: embed the
# license text in every wheel/sdist.
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
